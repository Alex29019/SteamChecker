<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Profile Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="glow"></div>
    
    <header>
      <h1>🎮 Steam Profile Checker</h1>
      <p class="subtitle">Проверка публичной информации профиля Steam</p>
    </header>

    <div class="card input-card">
      <label for="steamInput">SteamID64 или URL профиля</label>
      <input 
        type="text" 
        id="steamInput" 
        placeholder="76561198012345678 или https://steamcommunity.com/id/username"
        autocomplete="off"
      >
      <button id="checkBtn" onclick="checkProfile()">
        <span class="btn-text">Проверить</span>
        <span class="btn-loader"></span>
      </button>
      <p class="hint">💡 Найди свой SteamID64 на <a href="https://steamid.io/" target="_blank">steamid.io</a></p>
    </div>

    <div id="result" class="card result-card hidden">
      <div class="profile-header">
        <img id="avatar" class="avatar" src="" alt="avatar">
        <div class="profile-info">
          <h2 id="displayName"></h2>
          <p id="statusLine" class="status-line"></p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <span class="stat-label">Статус</span>
          <span id="status" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">VAC бан</span>
          <span id="vac" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">С нами с</span>
          <span id="memberSince" class="stat-value">—</span>
        </div>
      </div>

      <div id="verdict" class="verdict"></div>
    </div>

    <div id="error" class="card error-card hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
